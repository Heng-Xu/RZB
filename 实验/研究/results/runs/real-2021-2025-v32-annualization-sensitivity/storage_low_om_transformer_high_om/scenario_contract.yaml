metrics:
  net_load_sign:
    positive: import_from_upstream
    negative: reverse_export_to_upstream
  path_net_load_formula: P_net = P_actual + P_charge - P_discharge + P_tie
  aggregate_before_peak: true
  formal_clr:
    numerator: physical_installed_capacity_mva
    denominator: synchronized_positive_annual_grid_supply_peak_mw
    formula: R_path_year = S_installed_path_year / P_plus_path_year
    p_plus_formula: max_t(max(sum_i(P_net_path_i_t), 0))
    p_minus_formula: max_t(max(-sum_i(P_net_path_i_t), 0))
    denominator_direction: positive_only
    denominator_fixed_across_paths: false
    denominator_recomputed_from_path_net_load: true
    storage_may_change_denominator: true
    reverse_peak_is_separate_metric: true
    reverse_peak_must_not_be_formal_denominator: true
    policy_control_ratio_is_formal_clr: false
  policy_control:
    parameter: Rcap
    role: incremental_capacity_planning_control_parameter
    legacy_capacity_may_make_physical_clr_exceed_rcap: true
  anti_gaming:
    storage_charge_may_cross_zero_to_positive: false
    storage_discharge_may_export: false
    source_net_load_may_subtract_existing_pv_again: false
    static_device_extrema_may_sum_as_sync_peak: false
  device_gaps:
    positive_capacity_gap: max(P_forward_peak_i - H_forward_i, 0)
    reverse_hosting_gap: max(P_reverse_peak_i - H_reverse_i, 0)
    clr_above_2_alone_triggers_measure: false
