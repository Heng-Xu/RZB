    - 1.0
    evidence_type: engineering_baseline_with_sensitivity_not_universal_physical_constant
    parallel_formula: min(beta_scenario, (S_total - S_largest) / S_total)
    multiply_by_beta_after_parallel_formula: false
    unknown_operation_mode: report_split_parallel_sensitivity_interval
  network_check:
