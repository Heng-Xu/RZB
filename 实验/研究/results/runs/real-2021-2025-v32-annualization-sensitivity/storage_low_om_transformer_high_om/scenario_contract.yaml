evidence_grades:
  EVIDENCE_A: approved_real_2025_8760_with_quality_flags_and_full_playback
  EVIDENCE_B: real_static_data_plus_empirical_duration_scenarios
  EVIDENCE_C: unresolved_asset_mapping_parent_mapping_or_candidate_gap
local_10kv_cases:
  global_optimization_enabled: false
  existing_tie_reconfiguration:
    cli_option: --existing-tie-case-options
    display_name: 现有10 kV联络切分案例
    default_enabled: false
    independent_approval: true
    independent_failure: true
  new_tie_line:
    cli_option: --new-tie-line-case-options
    display_name: 新建10 kV联络线路案例
    default_enabled: false
    independent_approval: true
    independent_failure: true
  combination_rule: explicit_compatibility_and_dependencies_only
  required_checks:
  - county_power_conservation
  - no_duplicate_reverse_power_relief
  - no_duplicate_capacity_avoidance
  - no_duplicate_cost
outputs:
  formal_run_root: results/runs/real-2021-2025-v32-frozen
  formal_110_matrix:
    required_region_count: 8
    required_fields:
    - region_id
    - evidence_grade
    - asset_scope_id
    - recommended_clr_interval
    - PATH_ACTUAL_2021_2025_clr_2025
    - PATH_OPT_CLR_UNBOUNDED_clr_2025
    - PATH_OPT_CLR_LE_2_clr_2025
    - PATH_ACTUAL_2021_2025_cumulative_eac
    - PATH_OPT_CLR_UNBOUNDED_cumulative_eac
    - PATH_OPT_CLR_LE_2_cumulative_eac
    - strict_path_incremental_cost
    - positive_capacity_gap_mw
    - reverse_hosting_gap_mw
    - positive_gap_device_count
    - reverse_gap_device_count
    - recommended_measure
    - evidence_grade
  auxiliary_35_matrix:
    required_region_count: 8
    reporting_granularity: region
    unique_optimum_without_station_candidates_allowed: false
    additional_fields:
    - parent_supply_mapping_status
    - technical_gap_mw
    - expansion_cost_range_wanyuan
    - positive_capacity_gap_mw
    - reverse_hosting_gap_mw
    - positive_gap_device_count
    - reverse_gap_device_count
    - measure_trigger_constraint
  technical_appendices:
  - qx00005_path_validation.csv
  - path_year_results.csv
  - path_action_results.csv
  - path_cost_breakdown.csv
  - 内部容量网络压力检查.csv
  n_minus_1_visible_row_allowed: false
  report_language: current_condition_economic_measures_and_corresponding_clr_range
  word_matrix_orientation: transposed_indicator_rows_and_anonymized_region_columns
  legacy_artifact_policy: archive_with_legacy_contract_warning
hard_assertions:
- id: A001
  expression: no_cross_voltage_capacity_load_pv_or_cost_aggregation
- id: A002
  expression: formal_clr_uses_path_specific_positive_synchronous_peak_only
- id: A003
  expression: storage_cannot_cross_zero_or_export_and_recomputes_path_peak
- id: A004
  expression: no_curtailment_variable_or_cost
- id: A005
  expression: no_global_10kv_tie_decision
- id: A006
  expression: parallel_beta_not_multiplied_by_0_8_twice
- id: A007
  expression: all_actions_come_from_traceable_discrete_candidates
- id: A008
  expression: both_policy_paths_start_from_actual_2021_asset_state_and_legacy_capacity_is_grandfathered
- id: A009
  expression: actual_path_is_not_optimization_rank_eligible
- id: A010
  expression: qx00005_grade_a_requires_annual_whitelist_approval
- id: A011
  expression: empirical_scenarios_are_not_labeled_P50_or_P90
- id: A012
  expression: source_lineage_and_quality_flags_are_preserved
- id: A013
  expression: output_uses_anonymized_ids_only
- id: A014
  expression: strict_path_clr_limit_starts_in_2022
legacy_history:
  status: archive_only_not_formal_v3_output
  historical_contract_versions:
  - 2.0.0
  historical_artifacts:
  - real_2025
  - five_independent_annual_matrices
  historical_scheme_codes:
  - SCHEME_C0
  - SCHEME_A
  - SCHEME_B
  migration_rule: legacy_values_may_be_used_for_regression_or_archive_only
