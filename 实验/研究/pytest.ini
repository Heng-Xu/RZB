[pytest]
# Note: For bare 'python -m pytest' command to work without PYTEST_DISABLE_PLUGIN_AUTOLOAD=1,
# please use the wrapper script: ./scripts/runtests.sh
#
# Root cause: Global ROS2 environment has launch_pytest plugin that depends on 'lark' module
# (not installed in this project). Disabling via -p no:launch_pytest does not prevent
# setuptools entrypoint autoload. Solution requires PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 env var.
#
# See scripts/runtests.sh for permanent solution.

