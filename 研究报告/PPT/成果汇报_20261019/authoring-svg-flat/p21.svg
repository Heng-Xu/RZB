</g><g id="page-claim" font-family="Microsoft YaHei" data-pptx-bounds="35 212 890 48"><rect x="35" y="212" width="890" height="48" fill="none" stroke="none"/><text x="35" y="243" font-family="Microsoft YaHei" font-size="26" fill="#007C78" text-anchor="start" font-weight="bold">转供支援由源端、路径及接收侧能力共同决定</text></g><g id="source-note" font-family="Microsoft YaHei" data-pptx-bounds="35 663 850 30" data-pptx-role="footer"><rect x="35" y="663" width="850" height="30" fill="none" stroke="none"/><text x="35" y="679" font-family="Microsoft YaHei" font-size="13" fill="#5E7077" text-anchor="start" font-weight="normal">依据：研究报告3.6、5.5、表5-59—5-61</text></g><g id="transfer-topology" font-family="Microsoft YaHei" data-pptx-bounds="35 275 890 300"><rect x="35" y="275" width="890" height="300" fill="none" stroke="none"/><g><rect x="55" y="320" width="220" height="115" fill="#EAF3F1" stroke="#007C78" rx="0"/><text x="165" y="358" font-family="Microsoft YaHei" font-size="23" fill="#007C78" text-anchor="middle" font-weight="bold">源端站</text><text x="165" y="400" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="middle" font-weight="normal">可切换源荷区段</text></g><g><rect x="360" y="320" width="220" height="115" fill="#EAF3F1" stroke="#007C78" rx="0"/><text x="470" y="358" font-family="Microsoft YaHei" font-size="23" fill="#007C78" text-anchor="middle" font-weight="bold">共享馈线与联络</text><text x="470" y="400" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="middle" font-weight="normal">既有MW额度及通道热限</text></g><g><rect x="680" y="320" width="220" height="115" fill="#EAF3F1" stroke="#007C78" rx="0"/><text x="790" y="358" font-family="Microsoft YaHei" font-size="23" fill="#007C78" text-anchor="middle" font-weight="bold">受端站</text><text x="790" y="400" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="middle" font-weight="normal">馈线余量与主变容量</text></g><line x1="280" y1="378" x2="350" y2="378" stroke="#007C78" stroke-width="4"/><polygon points="350.00,378.00 339.04,382.89 339.04,373.11" fill="#007C78"/><line x1="585" y1="378" x2="670" y2="378" stroke="#007C78" stroke-width="4"/><polygon points="670.00,378.00 659.04,382.89 659.04,373.11" fill="#007C78"/><line x1="473" y1="436" x2="473" y2="495" stroke="#007C78" stroke-width="2"/><rect x="305" y="495" width="335" height="63" fill="#FFFFFF" stroke="#007C78" rx="0"/><text x="472" y="535" font-family="Microsoft YaHei" font-size="21" fill="#007C78" text-anchor="middle" font-weight="bold">多条联络共用馈线与区段预算</text><g><rect x="100" y="275" width="760" height="40" fill="none" stroke="none" rx="0"/><text x="480" y="298" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="middle" font-weight="bold">正常方式与主变N-1分别安排年度固定转供方案</text></g></g><g id="transfer-rating" font-family="Microsoft YaHei" data-pptx-bounds="35 570 890 32"><rect x="35" y="570" width="890" height="32" fill="none" stroke="none"/><text x="35" y="591" font-family="Microsoft YaHei" font-size="18" fill="#20393E" text-anchor="start" font-weight="normal">新增联络：485 A折算7.98 MW，工程取8.00 MW；示例区段有效转供7.49 MW。</text></g><g id="engineering-takeaway" font-family="Microsoft YaHei" data-pptx-bounds="35 610 890 48"><rect x="35" y="610" width="890" height="48" fill="none" stroke="none"/><rect x="35" y="610" width="890" height="48" fill="#EAF3F1" stroke="none" rx="0"/><text x="47" y="638" font-family="Microsoft YaHei" font-size="20" fill="#007C78" text-anchor="start" font-weight="normal">区段内负荷与光伏共同切换，区域内同小时转出与承接保持平衡。</text></g></svg>