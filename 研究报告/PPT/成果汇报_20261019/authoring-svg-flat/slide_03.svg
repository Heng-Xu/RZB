</g><g id="page-claim" font-family="Microsoft YaHei" data-pptx-bounds="35 212 890 48"><rect x="35" y="212" width="890" height="48" fill="none" stroke="none"/><text x="35" y="243" font-family="Microsoft YaHei" font-size="26" fill="#007C78" text-anchor="start" font-weight="bold">光伏接入使主变同时承担正向供电与反向输送任务</text></g><g id="source-note" font-family="Microsoft YaHei" data-pptx-bounds="35 663 850 30" data-pptx-role="footer"><rect x="35" y="663" width="850" height="30" fill="none" stroke="none"/><text x="35" y="679" font-family="Microsoft YaHei" font-size="13" fill="#5E7077" text-anchor="start" font-weight="normal">依据：研究报告1.1—1.2；《配电网规划设计技术导则（修订稿，2025年4月）》</text></g><g id="bidirectional-system" font-family="Microsoft YaHei" data-pptx-bounds="35 270 890 331"><rect x="35" y="270" width="890" height="331" fill="none" stroke="none"/><image href="../images/A1_双向容量任务.png" x="119.92583436341164" y="277.0" width="720.1483312731767" height="300.0" preserveAspectRatio="xMidYMid meet"/><text x="300" y="292" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="middle" font-weight="bold">日间：本地消纳与余电反送</text><text x="660" y="292" font-family="Microsoft YaHei" font-size="22" fill="#376382" text-anchor="middle" font-weight="bold">晚间：上级电网供电</text><line x1="300" y1="440" x2="300" y2="357" stroke="#007C78" stroke-width="4"/><polygon points="300.00,357.00 304.89,367.96 295.11,367.96" fill="#007C78"/><line x1="660" y1="357" x2="660" y2="440" stroke="#376382" stroke-width="4"/><polygon points="660.00,440.00 655.11,429.04 664.89,429.04" fill="#376382"/><text x="300" y="590" font-family="Microsoft YaHei" font-size="21" fill="#007C78" text-anchor="middle" font-weight="bold">反向容量校核</text><text x="660" y="590" font-family="Microsoft YaHei" font-size="21" fill="#376382" text-anchor="middle" font-weight="bold">正向峰值与主变N-1校核</text></g><g id="engineering-takeaway" font-family="Microsoft YaHei" data-pptx-bounds="35 610 890 48"><rect x="35" y="610" width="890" height="48" fill="none" stroke="none"/><rect x="35" y="610" width="890" height="48" fill="#EAF3F1" stroke="none" rx="0"/><text x="47" y="638" font-family="Microsoft YaHei" font-size="20" fill="#007C78" text-anchor="start" font-weight="normal">容载比由区域容量与年网供最大负荷共同决定，具体增容需联系站级任务。</text></g></svg>