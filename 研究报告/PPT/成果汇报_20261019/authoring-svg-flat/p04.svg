</g><g id="page-claim" font-family="Microsoft YaHei" data-pptx-bounds="35 212 890 48"><rect x="35" y="212" width="890" height="48" fill="none" stroke="none"/><text x="35" y="243" font-family="Microsoft YaHei" font-size="26" fill="#007C78" text-anchor="start" font-weight="bold">把片区推荐值落实为满足供电任务的工程配置</text></g><g id="source-note" font-family="Microsoft YaHei" data-pptx-bounds="35 663 850 30" data-pptx-role="footer"><rect x="35" y="663" width="850" height="30" fill="none" stroke="none"/><text x="35" y="679" font-family="Microsoft YaHei" font-size="13" fill="#5E7077" text-anchor="start" font-weight="normal">依据：研究报告1.4—1.5、图1-1</text></g><g id="explanation-1" font-family="Microsoft YaHei" data-pptx-bounds="35.0 275.0 280.6666666666667 147.5"><rect x="35.0" y="275.0" width="280.6666666666667" height="147.5" fill="none" stroke="none"/><line x1="35.0" y1="277.0" x2="315.6666666666667" y2="277.0" stroke="#007C78" stroke-width="2"/><text x="40.0" y="304.0" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="start" font-weight="bold">运行资料</text><text x="40.0" y="332.0" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="start" font-weight="normal">年度容量、同范围负荷与光伏<tspan x="40.0" dy="24">，46座站设备和转供资料</tspan></text></g><g id="explanation-2" font-family="Microsoft YaHei" data-pptx-bounds="339.6666666666667 275.0 280.6666666666667 147.5"><rect x="339.6666666666667" y="275.0" width="280.6666666666667" height="147.5" fill="none" stroke="none"/><line x1="339.6666666666667" y1="277.0" x2="620.3333333333334" y2="277.0" stroke="#007C78" stroke-width="2"/><text x="344.6666666666667" y="304.0" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="start" font-weight="bold">运行任务</text><text x="344.6666666666667" y="332.0" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="start" font-weight="normal">识别正向、反向及局部高峰，<tspan x="344.6666666666667" dy="24">保持同小时功率关系</tspan></text></g><g id="explanation-3" font-family="Microsoft YaHei" data-pptx-bounds="644.3333333333334 275.0 280.6666666666667 147.5"><rect x="644.3333333333334" y="275.0" width="280.6666666666667" height="147.5" fill="none" stroke="none"/><line x1="644.3333333333334" y1="277.0" x2="925.0" y2="277.0" stroke="#007C78" stroke-width="2"/><text x="649.3333333333334" y="304.0" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="start" font-weight="bold">工程费用</text><text x="649.3333333333334" y="332.0" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="start" font-weight="normal">主变、联络、储能按统一范围<tspan x="649.3333333333334" dy="24">及投运批次计费</tspan></text></g><g id="explanation-4" font-family="Microsoft YaHei" data-pptx-bounds="35.0 442.5 280.6666666666667 147.5"><rect x="35.0" y="442.5" width="280.6666666666667" height="147.5" fill="none" stroke="none"/><line x1="35.0" y1="444.5" x2="315.6666666666667" y2="444.5" stroke="#007C78" stroke-width="2"/><text x="40.0" y="471.5" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="start" font-weight="bold">联合比选</text><text x="40.0" y="499.5" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="start" font-weight="normal">逐年承接已投运设备，校核正<tspan x="40.0" dy="24">常与主变N-1条件</tspan></text></g><g id="explanation-5" font-family="Microsoft YaHei" data-pptx-bounds="339.6666666666667 442.5 280.6666666666667 147.5"><rect x="339.6666666666667" y="442.5" width="280.6666666666667" height="147.5" fill="none" stroke="none"/><line x1="339.6666666666667" y1="444.5" x2="620.3333333333334" y2="444.5" stroke="#007C78" stroke-width="2"/><text x="344.6666666666667" y="471.5" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="start" font-weight="bold">结果解释</text><text x="344.6666666666667" y="499.5" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="start" font-weight="normal">用设备组合、投运时点和分项<tspan x="344.6666666666667" dy="24">费用解释差异</tspan></text></g><g id="explanation-6" font-family="Microsoft YaHei" data-pptx-bounds="644.3333333333334 442.5 280.6666666666667 147.5"><rect x="644.3333333333334" y="442.5" width="280.6666666666667" height="147.5" fill="none" stroke="none"/><line x1="644.3333333333334" y1="444.5" x2="925.0" y2="444.5" stroke="#007C78" stroke-width="2"/><text x="649.3333333333334" y="471.5" font-family="Microsoft YaHei" font-size="22" fill="#007C78" text-anchor="start" font-weight="bold">条件推荐</text><text x="649.3333333333334" y="499.5" font-family="Microsoft YaHei" font-size="19" fill="#20393E" text-anchor="start" font-weight="normal">从十三项候选指标归纳五项参<tspan x="649.3333333333334" dy="24">数与查表范围</tspan></text></g><g id="engineering-takeaway" font-family="Microsoft YaHei" data-pptx-bounds="35 610 890 48"><rect x="35" y="610" width="890" height="48" fill="none" stroke="none"/><rect x="35" y="610" width="890" height="48" fill="#EAF3F1" stroke="none" rx="0"/><text x="47" y="638" font-family="Microsoft YaHei" font-size="20" fill="#007C78" text-anchor="start" font-weight="normal">资料、约束、费用和建设安排逐项衔接，形成“一片一策”的容量规划依据。</text></g></svg>