<g id="v2-method-15-0" font-family="Microsoft YaHei" data-pptx-bounds="35.0 274 433.0 151"><rect x="35.0" y="274" width="433.0" height="151" fill="none" stroke="none"/><line x1="35.0" y1="276" x2="468.0" y2="276" stroke="#007C78" stroke-width="2"/><text x="40.0" y="299" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">共同起点与承接</text><text x="40.0" y="324" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">以2021年实际容量为基期，邳州2027.00 MVA、<tspan x="40.0" dy="23">市区3113.50 MVA。后续各年承接已投运设备，</tspan><tspan x="40.0" dy="23">源荷输入与安全要求保持一致。</tspan></text></g><g id="v2-method-15-1" font-family="Microsoft YaHei" data-pptx-bounds="492.0 274 433.0 151"><rect x="492.0" y="274" width="433.0" height="151" fill="none" stroke="none"/><line x1="492.0" y1="276" x2="925.0" y2="276" stroke="#007C78" stroke-width="2"/><text x="497.0" y="299" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">刚性基准</text><text x="497.0" y="324" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">新增扩容按当年负荷两倍控制，负荷回落时保留<tspan x="497.0" dy="23">上年在役容量；局部任务继续由储能和联络共同</tspan><tspan x="497.0" dy="23">承担。</tspan></text></g><g id="v2-method-15-2" font-family="Microsoft YaHei" data-pptx-bounds="35.0 443 433.0 151"><rect x="35.0" y="443" width="433.0" height="151" fill="none" stroke="none"/><line x1="35.0" y1="445" x2="468.0" y2="445" stroke="#007C78" stroke-width="2"/><text x="40.0" y="468" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">弹性方案</text><text x="40.0" y="493" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">放宽2.0新增容量控制，在相同正常和故障承载要<tspan x="40.0" dy="23">求下比较措施组合，结合站级缺口和受端承接能</tspan><tspan x="40.0" dy="23">力形成设备方案。</tspan></text></g><g id="v2-method-15-3" font-family="Microsoft YaHei" data-pptx-bounds="492.0 443 433.0 151"><rect x="492.0" y="443" width="433.0" height="151" fill="none" stroke="none"/><line x1="492.0" y1="445" x2="925.0" y2="445" stroke="#007C78" stroke-width="2"/><text x="497.0" y="468" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">统一费用评价</text><text x="497.0" y="493" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">投运批次折算至2021年末，评价截止2041年，折<tspan x="497.0" dy="23">现率6.00%。建设和固定运维计入费用，比较完整</tspan><tspan x="497.0" dy="23">建设路径的新增支出。</tspan></text></g><g id="v2-closing-15" font-family="Microsoft YaHei" data-pptx-bounds="35 616 890 44"><rect x="35" y="616" width="890" height="44" fill="none" stroke="none"/><rect x="35" y="616" width="890" height="44" fill="#EAF3F1" stroke="none"/><text x="47" y="636" font-family="Microsoft YaHei" font-size="18" fill="#20393E">▪ 比较结果为所设条件下的具体可行方案，费用优势由各年度主变、储能与联络现金流共同支持。</text></g></svg>