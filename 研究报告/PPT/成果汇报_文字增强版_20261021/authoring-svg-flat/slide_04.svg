<g id="v2-method-4-0" font-family="Microsoft YaHei" data-pptx-bounds="35.0 274 280.6666666666667 153"><rect x="35.0" y="274" width="280.6666666666667" height="153" fill="none" stroke="none"/><line x1="35.0" y1="276" x2="315.6666666666667" y2="276" stroke="#007C78" stroke-width="2"/><text x="40.0" y="299" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">① 运行资料</text><text x="40.0" y="324" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">整理年度容量、同范围负荷和光<tspan x="40.0" dy="23">伏，匹配46座站的设备、净负</tspan><tspan x="40.0" dy="23">荷与既有转供资料。</tspan></text></g><g id="v2-method-4-1" font-family="Microsoft YaHei" data-pptx-bounds="339.6666666666667 274 280.6666666666667 153"><rect x="339.6666666666667" y="274" width="280.6666666666667" height="153" fill="none" stroke="none"/><line x1="339.6666666666667" y1="276" x2="620.3333333333334" y2="276" stroke="#007C78" stroke-width="2"/><text x="344.6666666666667" y="299" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">② 运行任务</text><text x="344.6666666666667" y="324" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">按同小时功率关系识别正向供电<tspan x="344.6666666666667" dy="23">、日间反送及局部近峰过程，明</tspan><tspan x="344.6666666666667" dy="23">确站级容量需求。</tspan></text></g><g id="v2-method-4-2" font-family="Microsoft YaHei" data-pptx-bounds="644.3333333333334 274 280.6666666666667 153"><rect x="644.3333333333334" y="274" width="280.6666666666667" height="153" fill="none" stroke="none"/><line x1="644.3333333333334" y1="276" x2="925.0" y2="276" stroke="#007C78" stroke-width="2"/><text x="649.3333333333334" y="299" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">③ 工程费用</text><text x="649.3333333333334" y="324" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">区分主变更换与扩建，按储能柜<tspan x="649.3333333333334" dy="23">数和新增联络项目计费，并统一</tspan><tspan x="649.3333333333334" dy="23">折算投运批次费用。</tspan></text></g><g id="v2-method-4-3" font-family="Microsoft YaHei" data-pptx-bounds="35.0 445 280.6666666666667 153"><rect x="35.0" y="445" width="280.6666666666667" height="153" fill="none" stroke="none"/><line x1="35.0" y1="447" x2="315.6666666666667" y2="447" stroke="#007C78" stroke-width="2"/><text x="40.0" y="470" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">④ 联合比选</text><text x="40.0" y="495" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">逐年承接已投运设备，在正常与<tspan x="40.0" dy="23">主变N-1约束下共同选择主变、</tspan><tspan x="40.0" dy="23">储能和联络措施。</tspan></text></g><g id="v2-method-4-4" font-family="Microsoft YaHei" data-pptx-bounds="339.6666666666667 445 280.6666666666667 153"><rect x="339.6666666666667" y="445" width="280.6666666666667" height="153" fill="none" stroke="none"/><line x1="339.6666666666667" y1="447" x2="620.3333333333334" y2="447" stroke="#007C78" stroke-width="2"/><text x="344.6666666666667" y="470" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">⑤ 结果解释</text><text x="344.6666666666667" y="495" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">联系设备台数组合、建设节点与<tspan x="344.6666666666667" dy="23">分项费用，解释地区差异及各措</tspan><tspan x="344.6666666666667" dy="23">施的替代关系。</tspan></text></g><g id="v2-method-4-5" font-family="Microsoft YaHei" data-pptx-bounds="644.3333333333334 445 280.6666666666667 153"><rect x="644.3333333333334" y="445" width="280.6666666666667" height="153" fill="none" stroke="none"/><line x1="644.3333333333334" y1="447" x2="925.0" y2="447" stroke="#007C78" stroke-width="2"/><text x="649.3333333333334" y="470" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">⑥ 条件推荐</text><text x="649.3333333333334" y="495" font-family="Microsoft YaHei" font-size="18" fill="#20393E" font-weight="normal" text-anchor="start">由十三项候选指标筛选五项参数<tspan x="649.3333333333334" dy="23">，按片区条件组织推荐矩阵，再</tspan><tspan x="649.3333333333334" dy="23">落实具体工程方案。</tspan></text></g><g id="v2-closing-4" font-family="Microsoft YaHei" data-pptx-bounds="35 616 890 44"><rect x="35" y="616" width="890" height="44" fill="none" stroke="none"/><rect x="35" y="616" width="890" height="44" fill="#EAF3F1" stroke="none"/><text x="47" y="636" font-family="Microsoft YaHei" font-size="18" fill="#20393E">▪ <tspan fill="#007C78" font-weight="bold">研究输出：</tspan>由运行特征、费用与设备结果形成五参数推荐范围，服务分片区容量规划。</text></g></svg>