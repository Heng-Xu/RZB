<g id="v2-figure-9" font-family="Microsoft YaHei" data-pptx-bounds="35 267 890 269"><rect x="35" y="267" width="890" height="269" fill="none" stroke="none"/><image href="../figures/V2_F04_46站方向压力.png" x="35.0" y="267.02197802197804" width="890.0" height="268.95604395604397" preserveAspectRatio="xMidYMid meet"/></g><g id="v2-analysis-9" font-family="Microsoft YaHei" data-pptx-bounds="35 543 890 115"><rect x="35" y="543" width="890" height="115" fill="none" stroke="none"/><text x="47" y="563" font-family="Microsoft YaHei" font-size="18.5" fill="#20393E">▪ <tspan fill="#007C78" font-weight="bold">空间差异：</tspan>46座站分别呈现正向与反向容量任务，邳州4座、市区1座站反向幅值较大，区域容量<tspan x="47" dy="24">储备与少数站局部压力可以同时存在。</tspan></text><text x="47" y="617" font-family="Microsoft YaHei" font-size="18.5" fill="#20393E">▪ <tspan fill="#007C78" font-weight="bold">设备判断：</tspan>本站可用能力取决于主变结构及N-1剩余容量，邻站支援还受路径和受端余量限制；<tspan x="47" dy="24">应把站级净负荷、设备与转供条件共同纳入比选。</tspan></text></g></svg>