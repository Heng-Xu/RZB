<g id="v2-screen-0" font-family="Microsoft YaHei" data-pptx-bounds="650 275 275 102"><rect x="650" y="275" width="275" height="102" fill="none" stroke="none"/><line x1="650" y1="277" x2="925" y2="277" stroke="#007C78" stroke-width="2"/><text x="655" y="300" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">① 十三项候选</text><text x="655" y="325" font-family="Microsoft YaHei" font-size="17.5" fill="#20393E" font-weight="normal" text-anchor="start">覆盖源荷、网络、峰段与工程价<tspan x="655" dy="23">格，先明确各指标的定义和取值</tspan><tspan x="655" dy="23">。</tspan></text></g><g id="v2-screen-1" font-family="Microsoft YaHei" data-pptx-bounds="650 380 275 102"><rect x="650" y="380" width="275" height="102" fill="none" stroke="none"/><line x1="650" y1="382" x2="925" y2="382" stroke="#007C78" stroke-width="2"/><text x="655" y="405" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">② 九项关联指标</text><text x="655" y="430" font-family="Microsoft YaHei" font-size="17.5" fill="#20393E" font-weight="normal" text-anchor="start">组内相关绝对值达到0.40，保<tspan x="655" dy="23">留能够反映容载比变化的信息。</tspan></text></g><g id="v2-screen-2" font-family="Microsoft YaHei" data-pptx-bounds="650 485 275 102"><rect x="650" y="485" width="275" height="102" fill="none" stroke="none"/><line x1="650" y1="487" x2="925" y2="487" stroke="#007C78" stroke-width="2"/><text x="655" y="510" font-family="Microsoft YaHei" font-size="21" fill="#007C78" font-weight="bold" text-anchor="start">③ 五项基础参数</text><text x="655" y="535" font-family="Microsoft YaHei" font-size="17.5" fill="#20393E" font-weight="normal" text-anchor="start">按0.70高相关阈值归并，优先<tspan x="655" dy="23">采用具有明确规划含义的基础输</tspan><tspan x="655" dy="23">入。</tspan></text></g><g id="v2-screen-note" font-family="Microsoft YaHei" data-pptx-bounds="35 602 890 57"><rect x="35" y="602" width="890" height="57" fill="none" stroke="none"/><text x="47" y="622" font-family="Microsoft YaHei" font-size="17.5" fill="#20393E">▪ <tspan fill="#007C78" font-weight="bold">统计说明：</tspan>采用受控组内Pearson相关、节点等权并保留零响应组。0.40与0.70用于本研究参数归纳<tspan x="47" dy="22">，筛选结果结合计算关系和规划含义解释。</tspan></text></g></svg>