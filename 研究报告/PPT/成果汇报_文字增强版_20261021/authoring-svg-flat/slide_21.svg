 340.10,355.22" fill="#007C78"/><line x1="585" y1="360" x2="670" y2="360" stroke="#007C78" stroke-width="3"/><polygon points="670.00,360.00 660.10,364.78 660.10,355.22" fill="#007C78"/><line x1="473" y1="405" x2="473" y2="435" stroke="#007C78" stroke-width="2"/><rect x="305" y="435" width="335" height="48" fill="#FFFFFF" stroke="#007C78"/><text x="472" y="465" font-family="Microsoft YaHei" font-size="20" fill="#007C78" font-weight="bold" text-anchor="middle">多条联络共用馈线与区段预算</text></g><g id="v2-transfer-analysis" font-family="Microsoft YaHei" data-pptx-bounds="35 517 890 140"><rect x="35" y="517" width="890" height="140" fill="none" stroke="none"/><text x="47" y="537" font-family="Microsoft YaHei" font-size="19" fill="#20393E">▪ <tspan fill="#007C78" font-weight="bold">共同校核：</tspan>区段内负荷与光伏一同切换，源端可切负荷、路径共享和受端主变余量共同限制转<tspan x="47" dy="25">供；正常与N-1分别采用年度固定方案。</tspan></text><text x="47" y="593" font-family="Microsoft YaHei" font-size="19" fill="#20393E">▪ <tspan fill="#007C78" font-weight="bold">工程取值：</tspan>10 kV、485 A及功率因数0.95折算有功7.98 MW，工程上限取8.00 MW；示例区段<tspan x="47" dy="25">有效转供7.49 MW，新增项目按投运年计费。</tspan></text></g></svg>