   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #7e8994" transform="translate(23.94 411.158125)">依据：本项目台账与路径规格；DB11/T 2077—2023第6.1.4条表3作为仿真规划参考。</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #7e8994" transform="translate(23.94 423)">设计单元采用多分段适度联络类型；不宣称实际线路已满足该目标，也不将北京标准表述为徐州强制参数。</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(90.615 86.724694)">线路规格</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(55.375312 105.233006)">10kV / 485A / PF=0.95</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(285.075 86.724694)">承载能力校核</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(294.602812 105.233006)">7.980 MW</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(485.535 86.724694)">规划负载率上限</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(479.349375 105.233006)">70%（参考标准）</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(685.995 86.724694)">局部区域负荷基数</text>
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(707.522813 105.233006)">5.586 MW</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(84.92 232.402294)">发送侧局部供电区域：一条标准馈线</text>
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(91.680469 253.995325)">规划最大负荷 P_base = 5.586 MW</text>
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(91.92 275.588356)">多条联络共享同一份区域负荷基数</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #243447" x="668.43" y="210.468687" transform="rotate(-0 668.43 210.468687)">接收馈线1：另校核接纳余量</text>
   </g>
   <g id="text_11">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #243447" x="668.43" y="310.260687" transform="rotate(-0 668.43 310.260687)">接收馈线2：另校核接纳余量</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(322.847266 363.802206)">q1 + q2 ≤ ρ × P_base；共享负荷只计一次</text>
    <text style="font-size: 13px; font-family: 'Noto Sans CJK JP'; fill: #243447" transform="translate(307.334609 384.261769)">ρ沿用导则定义，70%是规划负载率，不是转供率</text>
