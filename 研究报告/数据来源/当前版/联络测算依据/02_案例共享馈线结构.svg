   <g id="text_10">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #7e8994" transform="translate(23.94 478.365869)">数据：原始线路台账 + V2联络关系表；负荷按10 kV、PF=0.95和2025最大电流折算。</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #7e8994" transform="translate(23.94 490.207744)">年度各馈线峰值组成静态压力包络，数值用于仿真标定，不是同一时刻的实测潮流。</text>
   </g>
