name: diagnose current report page34

on:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/workflows/diagnose-current-report-page34.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-v3.2-autonomous-review
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-core pandoc poppler-utils fonts-noto-cjk
          python -m pip install numpy pandas matplotlib python-docx lxml pillow pyyaml

      - name: Rebuild exactly from main report workflow steps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          wf = yaml.safe_load(Path('.github/workflows/report-final-build.yml').read_text(encoding='utf-8'))
          wanted = {
              'Prepare and normalize report source',
              'Regenerate report figures',
              'Build final DOCX',
              'Normalize Word pagination and body tables',
              'Convert DOCX to PDF',
          }
          runs = []
          for step in wf['jobs']['build-final-report']['steps']:
              if step.get('name') in wanted:
                  runs.append((step['name'], step['run']))
          if len(runs) != len(wanted):
              raise SystemExit(f'missing steps: {wanted - {n for n,_ in runs}}')
          out = ['set -euo pipefail']
          for name, run in runs:
              out.append(f"echo '===== {name} ====='")
              out.append(run)
          Path('/tmp/rebuild_report.sh').write_text('\n'.join(out), encoding='utf-8')
          PY
          bash /tmp/rebuild_report.sh

      - name: Diagnose pages 30 to 38
        shell: bash
        run: |
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          OUT='研究报告/终稿/内部审查/PDF第30-38页版面诊断.txt'
          mkdir -p '研究报告/终稿/内部审查' /tmp/report-diagnose
          : > "$OUT"
          pdfinfo "$PDF" | grep '^Pages:' >> "$OUT"
          for p in $(seq 30 38); do
            echo "===== PAGE $p TEXT =====" >> "$OUT"
            pdftotext -f "$p" -l "$p" "$PDF" - >> "$OUT"
            echo "===== PAGE $p IMAGES =====" >> "$OUT"
            pdfimages -f "$p" -l "$p" -list "$PDF" >> "$OUT" 2>&1 || true
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 100 "$PDF" "/tmp/report-diagnose/page-$p" >/dev/null 2>&1
            python - "$p" >> "$OUT" <<'PY'
          import sys
          from PIL import Image, ImageChops
          p = sys.argv[1]
          img = Image.open(f'/tmp/report-diagnose/page-{p}.png').convert('L')
          hist = img.histogram()
          total = img.width * img.height
          lt248 = sum(hist[:248]) / total
          lt235 = sum(hist[:235]) / total
          diff = ImageChops.difference(img, Image.new('L', img.size, 255))
          print(f'render_size={img.width}x{img.height}')
          print(f'nonwhite_ratio_lt248={lt248:.8f}')
          print(f'nonnearwhite_ratio_lt235={lt235:.8f}')
          print(f'ink_bbox={diff.getbbox()}')
          PY
            echo >> "$OUT"
          done

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/内部审查/PDF第30-38页版面诊断.txt'
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
            exit 0
          fi
          git commit -m '诊断终稿PDF第30至38页版面 [report-page-diagnostic]'
          git fetch origin model-v3.2-autonomous-review
          git rebase --autostash origin/model-v3.2-autonomous-review
          git push origin HEAD:model-v3.2-autonomous-review
