name: Report policy
on: [push, pull_request]
jobs:
  report-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install python-docx==1.2.0 PyMuPDF==1.28.2
      - run: python tools/check_report_policy.py --stage final
