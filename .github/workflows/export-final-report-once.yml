name: export final report once

# Formula-rendering-fixed final export, 2026-09-17.
on:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/workflows/export-final-report-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-v3.2-autonomous-review
      - name: Upload final report package
        uses: actions/upload-artifact@v4
        with:
          name: final-report-package-formula-fixed
          if-no-files-found: error
          retention-days: 7
          path: |
            研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx
            研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf
            研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md
            研究报告/终稿/内部审查/自动检查结果.json
