name: integrate 10kV section-tie case into report

on:
  workflow_dispatch:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '实验/研究/scripts/integrate_10kv_report.py'
      - '实验/研究/results/10kv_section_tie_case/**'
      - '.github/workflows/integrate-10kv-report.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Integrate 10kV third-level sections
        run: python 实验/研究/scripts/integrate_10kv_report.py

      - name: Commit integrated report source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md'
          if git diff --cached --quiet; then
            echo '10kV report content already up to date.'
          else
            git commit -m '将10kV分段联络专题写入七章研究报告 [10kv-report-source]'
            git push origin HEAD:model-v3.2-autonomous-review
          fi
