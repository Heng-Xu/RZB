name: integrate 10kV section-tie case into report

on:
  workflow_dispatch:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/workflows/integrate-10kv-report.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Insert third-level 10kV content without changing opening-report directory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md')
          text = path.read_text(encoding='utf-8-sig')

          sec34 = '''

### 3.4.1 10 kV馈线分段—联络拓扑表达

为进一步刻画局部互济能力，10 kV馈线采用“节点—支路—开关”图结构表达。馈线出口、杆塔及分支节点构成网络节点，架空线和电缆构成物理支路，同馈线分段开关作为可切分边界，跨馈线联络开关作为网络重构边。分段识别时在分段开关位置临时切断图结构，由连通分量形成供电分段，并在各分段内聚合负荷与分布式新能源，得到分段净功率。正常运行时分段开关闭合，联络开关按照已确认运行状态保持开环或既定状态；故障情景则通过开关状态变化重构健康供电区域。

当前六条目标馈线已完成馈线—110 kV站映射、馈线边界、规划级线路参数及节点负荷/光伏种子准备。关键联络开关状态已有人工记录，其中TIE-002为墩南线与河炮线之间的站间联络，正常状态确认为断开。普通分段开关的具体现场身份仍需结合图纸符号和设备位置逐台校准，因此本报告将该层模型定位为规划级拓扑与容量分析，不将其表述为完整交流潮流或现场倒闸操作模型。
'''

          sec52 = '''

### 5.2.1 分段隔离—联络转供约束

10 kV局部互济遵循“分段开关负责隔离、联络开关负责转供”的运行逻辑。某一中间分段故障时，首先断开故障段两侧分段开关，使故障段与健康网络解列；若原馈线源端仍可用，则上游健康分段优先由原电源恢复，下游失电健康分段再搜索可用联络进行转供。只有在源端失电或整线检修等情景下，才进一步考虑由邻线承担更多健康分段，避免把局部分段故障简单等同为整条馈线倒供。

联络合闸前依次校核四类条件：一是受端电源与失电健康分段之间具有有效拓扑通路；二是重构后满足既定开环运行要求；三是受端馈线及联络路径不超过设备热限，并按甲方给定的80%专题规划控制线开展负载/反向潮流筛查；四是保护方向性与运行方式具备明确允许条件。对于保护资料不足的方案，只能判定为“拓扑与容量规划可行、保护需专项复核”，不能直接形成现场操作结论。
'''

          sec63 = '''

### 6.3.1 TIE-002分段—联络规划级案例验证

选取墩南线PZXL-00092与河炮线PZXL-00161之间的TIE-002作为首个10 kV联络案例。该联络正常状态为断开；墩南侧源端至联络点规划路径约2.25 km，基准热限约8.6603 MVA，河炮侧路径约2.75 km，基准热限约9.5263 MVA。2025年规划边界下，墩南线峰值有功为6.529596 MW，河炮线峰值有功为1.887590 MW，基准功率因数取0.95。

按规划包络计算，墩南线自身峰值对应的源端—联络路径利用率约79.37%。若在源端失电情景下将墩南整线峰值负荷全部经TIE-002转由河炮侧承担，河炮侧路径合计利用率约93.01%。该值尚未超过100%热限，但已高于甲方给定的80%专题规划控制线。严格按80%控制线筛查时，河炮侧可用于承接墩南负荷的规划上限约5.3524 MW，约占墩南整线峰值的81.97%。因此，该案例的规划结论不是“整线均可直接转供”，而是应通过分段隔离后进行选择性转供。

为说明线路切分方法，在尚未完成全部普通分段开关现场定位前，另采用三等值分段进行方法演示。每段等值负荷约2.1765 MW时，转供1段和2段对应河炮侧路径利用率约44.91%和68.96%，均满足80%控制线；3段全部转供时升至约93.01%。该三分段结果仅用于说明算法过程，不作为实测分段负荷结论。后续完成真实分段开关定位后，可直接按开关边界聚合节点负荷与光伏，替换等值分段并逐故障段生成实际恢复方案。

同时，以墩南线7.34 MW光伏峰值出力锚点开展零本地负荷的保守反送上界筛查：1.0倍光伏场景对应河炮侧路径利用率约77.05%，1.2倍升至约92.46%，1.5倍约115.57%。该结果不是历史同步潮流，而是规划风险包络，表明新能源继续增长后联络运行必须同时考虑反向潮流与保护方向性。10 kV联络模型由此为110 kV弹性容载比分析提供“实际可用互济能力”的工程解释，而不是简单以联络开关数量代表可转供能力。
'''

          if '### 3.4.1 10 kV馈线分段—联络拓扑表达' not in text:
              text = text.replace('\n# 第四章 基于实际工程的电网建设成本模型', sec34 + '\n# 第四章 基于实际工程的电网建设成本模型')
          if '### 5.2.1 分段隔离—联络转供约束' not in text:
              text = text.replace('\n## 5.3 基于层次分析法的指标赋权', sec52 + '\n## 5.3 基于层次分析法的指标赋权')
          if '### 6.3.1 TIE-002分段—联络规划级案例验证' not in text:
              text = text.replace('\n# 第七章 结论与展望', sec63 + '\n# 第七章 结论与展望')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit integrated report source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md'
          if git diff --cached --quiet; then
            echo '10kV report content already integrated.'
          else
            git commit -m '将10kV分段联络案例写入七章研究报告'
            git push origin HEAD:model-v3.2-autonomous-review
          fi
