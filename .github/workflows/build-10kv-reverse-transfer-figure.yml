name: build 10kV reverse-transfer report figure

on:
  workflow_dispatch:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '实验/研究/scripts/build_10kv_reverse_transfer_figure.py'
      - '.github/workflows/build-10kv-reverse-transfer-figure.yml'

permissions:
  contents: write

jobs:
  build-figure:
    if: ${{ !contains(github.event.head_commit.message || '', '[10kv-figure]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install figure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install matplotlib

      - name: Generate high-PV cross-station boundary figure
        run: |
          python 实验/研究/scripts/build_10kv_reverse_transfer_figure.py \
            --output '研究报告/终稿/图表/图6-1_TIE002分段联络示意.png'

      - name: Commit regenerated figure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/图表/图6-1_TIE002分段联络示意.png'
          if git diff --cached --quiet; then
            echo '10kV report figure already up to date.'
          else
            git commit -m '更新10kV高光伏跨站供电边界示意图 [10kv-figure]'
            git push origin HEAD:model-v3.2-autonomous-review
          fi
