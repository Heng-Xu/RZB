name: patch final numeric recommendations once

on:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/workflows/patch-final-numeric-recommendations-once.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-v3.2-autonomous-review
          fetch-depth: 0
      - name: Narrow formal report to numeric Rcap recommendations
        run: python 实验/研究/scripts/patch_final_numeric_recommendations.py
      - name: Commit narrowed formal report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md' \
            '实验/研究/scripts/build_final_report_figures.py'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m '收敛正式报告为数值型Rcap推荐片区'
            git push origin HEAD:model-v3.2-autonomous-review
          fi
