name: final report build and science QA

on:
  workflow_dispatch:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '研究报告/终稿/**'
      - '实验/研究/scripts/build_final_report_figures.py'
      - '实验/研究/scripts/build_10kv_reverse_transfer_figure.py'
      - '实验/研究/scripts/run_10kv_reverse_transfer_case.py'
      - '实验/研究/scripts/check_10kv_reverse_transfer_data.py'
      - '实验/研究/src/feeder_10kv_reverse_transfer.py'
      - '实验/研究/results/10kv_reverse_transfer_case/**'
      - '实验/研究/scripts/check_final_report.py'
      - '实验/研究/src/report_interval_matrix.py'
      - 'tools/build_report_docx.py'
      - '.github/workflows/report-final-build.yml'

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  build-final-report:
    if: ${{ !contains(github.event.head_commit.message || '', '[report-artifacts]') && !contains(github.event.head_commit.message || '', '[report-diagnostics]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-core pandoc poppler-utils fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib python-docx lxml pillow

      - name: Validate 10kV reverse-transfer model
        run: |
          python 实验/研究/scripts/check_10kv_reverse_transfer_data.py
          python 实验/研究/scripts/run_10kv_reverse_transfer_case.py

      - name: Prepare and normalize report source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          report_dir = Path('研究报告/终稿')
          source = report_dir / '国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md'
          target = report_dir / '.report_build.md'
          text = source.read_text(encoding='utf-8-sig')

          replacements = [
              (
                  '![图 2-1 实际物理容载比与规划控制值的关系](图表/图3-1_物理容载比与规划控制值.png)\n\n储能按本地功率调节资源建模。',
                  '![图 2-1 实际物理容载比与规划控制值的关系](图表/图3-1_物理容载比与规划控制值.png)\n\n图2-1说明了实际物理容载比与Rcap规划控制值的概念边界：前者是结果指标，后者只约束规划期新增容量。\n\n储能按本地功率调节资源建模。',
              ),
              (
                  '该跨年度组合不解释为严格同期运行状态。\n\n**表 3-1 主要数据及用途**',
                  '该跨年度组合不解释为严格同期运行状态。主要数据及用途见表3-1。\n\n**表 3-1 主要数据及用途**',
              ),
              (
                  '![图 4-2 弹性容载比控制值与规划措施](图表/图5-2_弹性控制值规划响应.png)\n\nQX-00001的局部经济释放阈值',
                  '![图 4-2 弹性容载比控制值与规划措施](图表/图5-2_弹性控制值规划响应.png)\n\n图4-1反映Rcap变化对规划期累计在役等年成本的影响，图4-2进一步展示新增变电容量与储能规模随控制值变化形成的措施替代关系。\n\nQX-00001的局部经济释放阈值',
              ),
              (
                  '![图 5-1 弹性容载比工程应用流程](图表/图8-1_工程应用流程.png)\n\n工程应用时，应先完成技术可行性校核',
                  '![图 5-1 弹性容载比工程应用流程](图表/图8-1_工程应用流程.png)\n\n图5-1给出了从技术可行性检查、核心指标计算、相似样本参考到专项Rcap优化的工程应用顺序。\n\n工程应用时，应先完成技术可行性校核',
              ),
              (
                  '规划决策遵循“既有联络优先、既有能力不足后再考虑新增联络”的两级逻辑：第一层优先利用已经形成物理联络条件的通道调整供电边界；第二层仅对既有联络无法承接的剩余反向功率，计算新增联络所需的最小有效容量，并筛选具备受端容量条件的相邻馈线。',
                  '规划决策遵循“既有联络优先、既有能力不足后再考虑新增联络”的两级逻辑：第一层优先利用已经形成物理联络条件的通道调整供电边界；第二层仅对既有联络无法承接的剩余反向功率，计算新增联络所需的最小有效容量，并筛选具备受端容量条件的相邻馈线。在约束满足的前提下，模型采用分层目标：首先最大化送端反向功率削减量，其次优先利用既有联络以减少新增工程，最后对仍需转移的剩余功率最小化新增联络有效容量。',
              ),
              (
                  '0\\le x_e\\le \\min\\left(S_{e,D}^{\\mathrm{eff}},\\beta S_{e,R}^{\\mathrm{eff}},H_R\\right)',
                  '0\\le P_{e,\\mathrm{tr}}\\le \\min\\left(S_{e,D}^{\\mathrm{eff}},\\beta S_{e,R}^{\\mathrm{eff}},H_R\\right)',
              ),
              (
                  'G_{\\mathrm{res}}=\\max\\left(G-x_e,0\\right)',
                  'G_{\\mathrm{res}}=\\max\\left(G-P_{e,\\mathrm{tr}},0\\right)',
              ),
              (
                  '式中，β为反向功率通道控制系数。本项目专题分析按给定条件取β=0.80。该80%控制线仅用于反向功率通道，不作为普通正向负荷转供的统一负载率上限，也不解释为国家或行业通用标准。',
                  '式中，β为反向功率通道控制系数。依据本项目专题分析采用的反向潮流控制条件，β取0.80。该80%控制线仅用于受端反向功率通道的规划筛查，不作为普通正向负荷转供的统一负载率上限，也不解释为国家或行业通用标准。',
              ),
              (
                  '该结果用于确定新增联络的容量等级和候选受端馈线，不直接等同于具体线路型号、线路长度或工程投资。',
                  '式（5-5）按高光伏反向功率功率因数近似1.0进行规划级容量换算，因此所得MVA值可作为相应有功转移需求的有效容量下限。该结果用于确定新增联络的容量等级和候选受端馈线，不直接等同于具体线路型号、线路长度或工程投资。',
              ),
              (
                  '河炮侧联络点至站端路径约2.75 km，导线基准热限为9.5263 MVA，低于馈线运行允许上限10.3057 MVA，因此受端路径规划有效容量取9.5263 MVA。',
                  '河炮侧联络点至站端路径约2.75 km，导线基准热限为9.5263 MVA，低于馈线运行允许上限10.3057 MVA，因此受端路径规划有效容量取9.5263 MVA。河炮线现有光伏汇总为0 kVA；同时，由于缺少与墩南线光伏峰值严格同步的受端负荷断面，容量筛查不利用河炮线本地负荷抵消转移功率，而按跨站转移功率单独占用受端通道处理，属于偏保守口径。高光伏反向转移按功率因数近似1.0进行规划级容量换算，因此本案例中MVA通道限值可近似映射为MW有功转移上限。',
              ),
              (
                  '墩集变与河湾变2025年年度最小净负荷分别为-37.27 MW和-5.22 MW，表明墩集侧反向送电压力明显高于河湾侧。该组数据用于识别跨站功率再分配的工程方向，但两个年度最小值并非同一时间戳，不能直接解释为某一历史同步断面的双站潮流。墩南线另具有7.34 MW实际光伏峰值出力锚点，该数值用于构造高光伏规划场景，不解释为完整装机容量。',
                  '墩集变与河湾变2025年年度最小净负荷分别为-37.27 MW和-5.22 MW，表明墩集侧反向送电压力明显高于河湾侧。该组数据用于识别跨站功率再分配的工程方向，但两个年度最小值并非同一时间戳，不能直接解释为某一历史同步断面的双站潮流。按河湾变最大主变退出后剩余50 MVA容量进行简单N-1热容量筛查，并扣除5.22 MW反向功率锚点后，站级反向承接余量约44.78 MW，高于TIE-002通道上限，因此当前案例的主导容量约束来自10 kV受端通道而非站级容量。该余量仅用于规划级热容量筛查，不替代实际N-1潮流、母线电压和保护校核。墩南线另具有7.34 MW实际光伏峰值出力锚点，该数值用于构造高光伏规划场景，不解释为完整装机容量。',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)

          # 新增10 kV公式位于5.2.1，应按正文出现顺序编号；AHP公式顺延。
          equation_numbers = re.findall(r'^（(\d+-\d+)）$', text, re.M)
          wrong_ch5 = ['5-2', '5-3', '5-4', '5-5', '5-1']
          ch5 = [n for n in equation_numbers if n.startswith('5-')]
          if ch5 == wrong_ch5:
              for old, temp in [('5-2', '5-T1'), ('5-3', '5-T2'), ('5-4', '5-T3'), ('5-5', '5-T4')]:
                  text = text.replace(f'（{old}）', f'（{temp}）')
              text = text.replace('（5-1）', '（5-5）')
              for temp, new in [('5-T1', '5-1'), ('5-T2', '5-2'), ('5-T3', '5-3'), ('5-T4', '5-4')]:
                  text = text.replace(f'（{temp}）', f'（{new}）')

          # 表6-3必须在正文中先被明确引用，避免只有表题没有正文指引。
          table63_caption = '**表 6-3 TIE-002高光伏跨站反向功率转移规划结果**'
          table63_intro = '上述场景的容量对比结果汇总见表6-3。'
          if table63_caption in text and table63_intro not in text:
              text = text.replace(table63_caption, table63_intro + '\n\n' + table63_caption)

          if '$' in text.replace('$$', ''):
              raise SystemExit('正文仍存在行内LaTeX，拒绝生成Word')
          source.write_text(text, encoding='utf-8')
          target.write_text(text, encoding='utf-8')

          # 同步扩展QA公式清单：10 kV新增公式属于正式正文，不应仍按旧13式检查。
          qa_path = Path('实验/研究/scripts/check_final_report.py')
          qa = qa_path.read_text(encoding='utf-8')
          old_equations = '''    expected_equations = (\n        [f"2-{i}" for i in range(1, 6)]\n        + [f"3-{i}" for i in range(1, 5)]\n        + [f"4-{i}" for i in range(1, 4)]\n        + ["5-1"]\n    )'''
          new_equations = '''    expected_equations = (\n        [f"2-{i}" for i in range(1, 6)]\n        + [f"3-{i}" for i in range(1, 8)]\n        + [f"4-{i}" for i in range(1, 4)]\n        + [f"5-{i}" for i in range(1, 6)]\n        + [f"6-{i}" for i in range(1, 3)]\n    )'''
          if old_equations in qa:
              qa = qa.replace(old_equations, new_equations)
          qa = qa.replace(
              '    if math_count != 13:\n        issues.append(f"Word原生公式数量应为13，实际为{math_count}")',
              '    if math_count != len(expected_equations):\n        issues.append(f"Word原生公式数量应为{len(expected_equations)}，实际为{math_count}")',
          )
          qa_path.write_text(qa, encoding='utf-8')
          PY

      - name: Regenerate report figures
        run: |
          python 实验/研究/scripts/build_final_report_figures.py \
            --output-dir '研究报告/终稿/图表'

      - name: Build final DOCX
        run: |
          python tools/build_report_docx.py \
            --template '研究报告/中期研究报告初稿/03+XX项目-研究报告.docx' \
            --input '研究报告/终稿/.report_build.md' \
            --output '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx' \
            --title '国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究' \
            --subtitle '研究报告' \
            --organization '国网江苏省电力有限公司徐州供电分公司' \
            --date '2026年9月'

      - name: Normalize Word pagination and body tables
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          from docx.oxml.ns import qn
          path = '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx'
          doc = Document(path)
          changed = 0
          for table in doc.tables:
              for index, row in enumerate(table.rows):
                  if index == 0:
                      continue
                  tr_pr = row._tr.get_or_add_trPr()
                  cant_split = tr_pr.find(qn('w:cantSplit'))
                  if cant_split is not None:
                      tr_pr.remove(cant_split)
                      changed += 1
          # “参考文献”不是第八章，取消其强制新页属性，避免正文恰好跨页时生成真实空白页。
          for paragraph in doc.paragraphs:
              if paragraph.text.strip() == '参考文献':
                  paragraph.paragraph_format.page_break_before = False
          doc.save(path)
          print(f'Allowed {changed} body table rows to split across pages; normalized references pagination.')
          PY

      - name: Convert DOCX to PDF
        shell: bash
        run: |
          DOCX='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx'
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          rm -f "$PDF"
          mkdir -p /tmp/lo-profile
          libreoffice -env:UserInstallation=file:///tmp/lo-profile --headless --convert-to pdf --outdir '研究报告/终稿' "$DOCX"
          test -s "$PDF"

      - name: Record PDF page context
        shell: bash
        run: |
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          OUT='研究报告/终稿/内部审查/PDF第24-26页文本上下文.txt'
          mkdir -p '研究报告/终稿/内部审查'
          : > "$OUT"
          for p in 24 25 26; do
            echo "===== PAGE $p =====" >> "$OUT"
            pdftotext -f "$p" -l "$p" "$PDF" - >> "$OUT"
            echo >> "$OUT"
          done

      - name: Run report semantic and numeric QA
        run: |
          python 实验/研究/scripts/check_final_report.py \
            --root . \
            --markdown '研究报告/终稿/.report_build.md' \
            --docx '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx' \
            --pdf '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf' \
            --output-dir '研究报告/终稿/内部审查'

      - name: Commit QA diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ ! -f '研究报告/终稿/内部审查/自动检查结果.json' ]; then
            echo 'No QA result file was produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/内部审查/自动检查结果.json' \
                  '研究报告/终稿/内部审查/数值追溯表.csv' \
                  '研究报告/终稿/内部审查/PDF第24-26页文本上下文.txt' \
                  '实验/研究/scripts/check_final_report.py'
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit.'
          else
            git commit -m '更新七章终稿QA失败诊断 [report-diagnostics]'
            git fetch origin model-v3.2-autonomous-review
            git rebase --autostash origin/model-v3.2-autonomous-review
            git push origin HEAD:model-v3.2-autonomous-review
          fi

      - name: Render PDF pages for layout preflight
        shell: bash
        run: |
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          rm -rf /tmp/report-pages
          mkdir -p /tmp/report-pages
          pdftoppm -png -r 120 "$PDF" /tmp/report-pages/page >/dev/null 2>&1
          count=$(find /tmp/report-pages -name 'page-*.png' | wc -l)
          test "$count" -ge 30
          echo "Rendered $count PDF pages for layout preflight"

      - name: Remove temporary build source
        if: always()
        run: rm -f '研究报告/终稿/.report_build.md'

      - name: Commit regenerated report artifacts
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/图表' \
                  '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md' \
                  '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx' \
                  '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf' \
                  '研究报告/终稿/内部审查/数值追溯表.csv' \
                  '研究报告/终稿/内部审查/自动检查结果.json' \
                  '研究报告/终稿/内部审查/PDF第24-26页文本上下文.txt' \
                  '实验/研究/results/10kv_reverse_transfer_case' \
                  '实验/研究/scripts/check_final_report.py'
          if git diff --cached --quiet; then
            echo 'No regenerated artifact changes to commit.'
          else
            git commit -m '重建七章终稿Word PDF及图件 [report-artifacts]'
            git fetch origin model-v3.2-autonomous-review
            git rebase --autostash origin/model-v3.2-autonomous-review
            git push origin HEAD:model-v3.2-autonomous-review
          fi
