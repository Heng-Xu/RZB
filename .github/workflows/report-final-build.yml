name: final report build and science QA

on:
  workflow_dispatch:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '研究报告/终稿/**'
      - '实验/研究/scripts/build_final_report_figures.py'
      - '实验/研究/scripts/check_final_report.py'
      - '实验/研究/src/report_interval_matrix.py'
      - 'tools/build_report_docx.py'
      - '.github/workflows/report-final-build.yml'

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  build-final-report:
    if: ${{ !contains(github.event.head_commit.message || '', '[report-artifacts]') && !contains(github.event.head_commit.message || '', '[report-diagnostics]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-core pandoc poppler-utils fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib python-docx lxml pillow

      - name: Prepare report source for DOCX renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          report_dir = Path('研究报告/终稿')
          source = report_dir / '国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md'
          target = report_dir / '.report_build.md'
          text = source.read_text(encoding='utf-8-sig')
          replacements = [
              (
                  '![图 2-1 实际物理容载比与规划控制值的关系](图表/图3-1_物理容载比与规划控制值.png)\n\n储能按本地功率调节资源建模。',
                  '![图 2-1 实际物理容载比与规划控制值的关系](图表/图3-1_物理容载比与规划控制值.png)\n\n图2-1说明了实际物理容载比与Rcap规划控制值的概念边界：前者是结果指标，后者只约束规划期新增容量。\n\n储能按本地功率调节资源建模。',
              ),
              (
                  '该跨年度组合不解释为严格同期运行状态。\n\n**表 3-1 主要数据及用途**',
                  '该跨年度组合不解释为严格同期运行状态。主要数据及用途见表3-1。\n\n**表 3-1 主要数据及用途**',
              ),
              (
                  '![图 4-2 弹性容载比控制值与规划措施](图表/图5-2_弹性控制值规划响应.png)\n\nQX-00001的局部经济释放阈值',
                  '![图 4-2 弹性容载比控制值与规划措施](图表/图5-2_弹性控制值规划响应.png)\n\n图4-1反映Rcap变化对规划期累计在役等年成本的影响，图4-2进一步展示新增变电容量与储能规模随控制值变化形成的措施替代关系。\n\nQX-00001的局部经济释放阈值',
              ),
              (
                  '![图 5-1 弹性容载比工程应用流程](图表/图8-1_工程应用流程.png)\n\n工程应用时，应先完成技术可行性校核',
                  '![图 5-1 弹性容载比工程应用流程](图表/图8-1_工程应用流程.png)\n\n图5-1给出了从技术可行性检查、核心指标计算、相似样本参考到专项Rcap优化的工程应用顺序。\n\n工程应用时，应先完成技术可行性校核',
              ),
              (
                  '工程应用时，应先完成技术可行性校核，再利用4项核心指标查找可比片区。与数值推荐样本相似时，2.50或2.30只能作为Rcap扫描的参考起点，不能未经专项计算直接套用为最终控制值。变电扩建适合应对持续增长的正向峰值，储能适合承担局部反向功率调节，10 kV联络和转供用于改善局部容量分布，三类措施应结合片区主要矛盾进行组合。',
                  '工程应用时，应先校核技术可行性，再利用4项核心指标查找可比片区。与数值推荐样本相似时，2.50或2.30仅作为Rcap扫描起点，最终控制值仍需专项计算。变电扩建应对正向峰值增长，储能承担局部反向功率调节，10 kV联络和转供改善局部容量分布，三类措施按片区主要矛盾组合。',
              ),
              (
                  '该下限高于单一基准情景的局部释放位置，为经济参数、功率因数、反向允许系数、净负荷尺度和工程成本变化预留了稳健余量。\n\n**表 6-1 QX-00005刚性与弹性方案验证结果**',
                  '该下限高于单一基准情景的局部释放位置，为经济参数、功率因数、反向允许系数、净负荷尺度和工程成本变化预留了稳健余量。两场景的主要对比结果见表6-1。\n\n**表 6-1 QX-00005刚性与弹性方案验证结果**',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
          if '$' in text.replace('$$', ''):
              raise SystemExit('正文仍存在行内LaTeX，拒绝生成Word')
          source.write_text(text, encoding='utf-8')
          target.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate report figures
        run: |
          python 实验/研究/scripts/build_final_report_figures.py \
            --output-dir '研究报告/终稿/图表'

      - name: Build final DOCX
        run: |
          python tools/build_report_docx.py \
            --template '研究报告/中期研究报告初稿/03+XX项目-研究报告.docx' \
            --input '研究报告/终稿/.report_build.md' \
            --output '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx' \
            --title '国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究' \
            --subtitle '研究报告' \
            --organization '国网江苏省电力有限公司徐州供电分公司' \
            --date '2026年9月'

      - name: Allow body table rows to split across pages
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          from docx.oxml.ns import qn
          path = '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx'
          doc = Document(path)
          changed = 0
          for table in doc.tables:
              for index, row in enumerate(table.rows):
                  if index == 0:
                      continue
                  tr_pr = row._tr.get_or_add_trPr()
                  cant_split = tr_pr.find(qn('w:cantSplit'))
                  if cant_split is not None:
                      tr_pr.remove(cant_split)
                      changed += 1
          doc.save(path)
          print(f'Allowed {changed} body table rows to split across pages; header rows remain unsplittable.')
          PY

      - name: Convert DOCX to PDF
        shell: bash
        run: |
          DOCX='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx'
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          rm -f "$PDF"
          mkdir -p /tmp/lo-profile
          libreoffice -env:UserInstallation=file:///tmp/lo-profile --headless --convert-to pdf --outdir '研究报告/终稿' "$DOCX"
          test -s "$PDF"

      - name: Record PDF page 24-26 context
        shell: bash
        run: |
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          OUT='研究报告/终稿/内部审查/PDF第24-26页文本上下文.txt'
          mkdir -p '研究报告/终稿/内部审查'
          : > "$OUT"
          for p in 24 25 26; do
            echo "===== PAGE $p =====" >> "$OUT"
            pdftotext -f "$p" -l "$p" "$PDF" - >> "$OUT"
            echo >> "$OUT"
          done

      - name: Run report semantic and numeric QA
        run: |
          python 实验/研究/scripts/check_final_report.py \
            --root . \
            --markdown '研究报告/终稿/.report_build.md' \
            --docx '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx' \
            --pdf '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf' \
            --output-dir '研究报告/终稿/内部审查'

      - name: Commit QA diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ ! -f '研究报告/终稿/内部审查/自动检查结果.json' ]; then
            echo 'No QA result file was produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/内部审查/自动检查结果.json' \
                  '研究报告/终稿/内部审查/数值追溯表.csv' \
                  '研究报告/终稿/内部审查/PDF第24-26页文本上下文.txt'
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit.'
          else
            git commit -m '更新七章终稿QA失败诊断 [report-diagnostics]'
            git push origin HEAD:model-v3.2-autonomous-review
          fi

      - name: Render PDF pages for layout preflight
        shell: bash
        run: |
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          rm -rf /tmp/report-pages
          mkdir -p /tmp/report-pages
          pdftoppm -png -r 120 "$PDF" /tmp/report-pages/page >/dev/null 2>&1
          count=$(find /tmp/report-pages -name 'page-*.png' | wc -l)
          test "$count" -ge 30
          echo "Rendered $count PDF pages for layout preflight"

      - name: Remove temporary build source
        if: always()
        run: rm -f '研究报告/终稿/.report_build.md'

      - name: Commit regenerated report artifacts
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/图表' \
                  '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md' \
                  '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.docx' \
                  '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf' \
                  '研究报告/终稿/内部审查/数值追溯表.csv' \
                  '研究报告/终稿/内部审查/自动检查结果.json'
          if git diff --cached --quiet; then
            echo 'No regenerated artifact changes to commit.'
          else
            git commit -m '重建七章终稿Word PDF及图件 [report-artifacts]'
            git push origin HEAD:model-v3.2-autonomous-review
          fi
