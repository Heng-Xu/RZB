name: v3.2 chronology preflight

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag, or 40-character commit SHA to validate'
        required: false
        type: string
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/v32-dependency-policy.yaml'
      - '.github/workflows/v32-*.yml'
      - '实验/研究/model_contract.yaml'
      - '实验/研究/model_contract_v3_2_overlay.yaml'
      - '实验/研究/data/processed/real_2021_2025/**'
      - '实验/研究/src/v32_*.py'
      - '实验/研究/src/v3_*.py'
      - '实验/研究/src/real_*.py'
      - '实验/研究/src/annual_asset_scope.py'
      - '实验/研究/src/empirical_scenarios.py'
      - '实验/研究/src/io_loader.py'
      - '实验/研究/src/milp_planner.py'
      - '实验/研究/src/legacy_milp_planner.py'
      - '实验/研究/src/net_model.py'
      - '实验/研究/src/links_sigma.py'
      - '实验/研究/src/timeseries_mapping.py'
      - '实验/研究/src/typical_days.py'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  qx00005-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - name: Record validated commit
        run: echo "V32_VALIDATION_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pyyaml xarray linopy highspy networkx scikit-learn
      - name: Compare daily-cyclic and continuous-8760 storage sizing
        working-directory: 实验/研究
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import shutil
          import pandas as pd

          from src.v32_actual_pipeline import run_v32_actual_baseline

          root = Path('.').resolve()
          processed = root / 'data/processed/real_2021_2025'
          work = root / 'results/runs/v32-chronology-preflight'
          shutil.rmtree(work, ignore_errors=True)
          manifest = run_v32_actual_baseline(root, processed, work)
          comparison = pd.read_csv(work / 'qx00005_chronology_comparison.csv')
          required_paths = {'PATH_OPT_CLR_UNBOUNDED', 'PATH_OPT_CLR_LE_2'}
          observed_paths = set(comparison['path_id'].astype(str))
          if observed_paths != required_paths:
              raise RuntimeError(f'chronology paths mismatch: {sorted(observed_paths)}')
          summary = {
              'validation_commit_sha': os.environ['V32_VALIDATION_COMMIT_SHA'],
              'baseline_manifest_validation_commit_sha': manifest['validation_commit_sha'],
              'retirement_candidates_enabled': manifest['retirement_candidates_enabled'],
              'chronology_rows': int(len(comparison)),
              'paths': sorted(observed_paths),
              'continuous_soc_summary_rows': int(
                  manifest['qx00005_continuous_soc_artifacts'][
                      'qx00005_continuous_soc_summary.csv'
                  ]['rows']
              ),
              'continuous_soc_curve_rows': int(
                  manifest['qx00005_continuous_soc_artifacts'][
                      'qx00005_continuous_soc_8760.csv.gz'
                  ]['rows']
              ),
          }
          if summary['retirement_candidates_enabled']:
              raise RuntimeError('primary chronology preflight cannot enable retirements')
          (work / 'preflight_summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v32-chronology-preflight
          path: 实验/研究/results/runs/v32-chronology-preflight/
          if-no-files-found: error
