name: finalize report Chinese terminology and layout once

on:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - 'tools/finalize_report_cn_layout.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply final terminology and layout patch
        run: python tools/finalize_report_cn_layout.py
      - name: Commit patched report sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            '研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.md' \
            tools/build_report_docx.py
          if git diff --cached --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git commit -m '统一终稿中文术语并修正公式版式 [report-artifacts]'
          git push origin HEAD:model-v3.2-autonomous-review
