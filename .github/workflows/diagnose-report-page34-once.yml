name: diagnose report page 34 once

on:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/workflows/diagnose-report-page34-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Inspect PDF page 33-35
        shell: bash
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null
          python -m pip install --quiet pillow
          PDF='研究报告/终稿/国网徐州公司徐州地区分布式新能源高渗透率地区110kV电网容载比弹性指标优化研究-研究报告终稿.pdf'
          OUT='研究报告/终稿/内部审查/PDF第33-35页版面诊断.txt'
          mkdir -p '研究报告/终稿/内部审查'
          : > "$OUT"
          pdfinfo "$PDF" | grep '^Pages:' >> "$OUT"
          for p in 33 34 35; do
            echo "===== PAGE $p TEXT =====" >> "$OUT"
            pdftotext -f "$p" -l "$p" -layout "$PDF" - >> "$OUT"
            echo >> "$OUT"
            echo "===== PAGE $p IMAGES =====" >> "$OUT"
            pdfimages -f "$p" -l "$p" -list "$PDF" >> "$OUT" || true
            echo >> "$OUT"
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 100 "$PDF" "/tmp/report-p$p" >/dev/null 2>&1
            python - "$p" >> "$OUT" <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          import sys
          p = sys.argv[1]
          img = Image.open(Path(f'/tmp/report-p{p}.png')).convert('L')
          total = img.width * img.height
          hist = img.histogram()
          nonwhite = sum(hist[:248])
          nonnearwhite = sum(hist[:235])
          inv = ImageChops.invert(img)
          bbox = inv.point(lambda x: 255 if x > 7 else 0).getbbox()
          print(f'render_size={img.width}x{img.height}')
          print(f'nonwhite_ratio_lt248={nonwhite/total:.8f}')
          print(f'nonnearwhite_ratio_lt235={nonnearwhite/total:.8f}')
          print(f'ink_bbox={bbox}')
          PY
            echo >> "$OUT"
          done
          cat "$OUT"
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '研究报告/终稿/内部审查/PDF第33-35页版面诊断.txt'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '诊断终稿PDF第34页版面 [page34-diagnostic]'
          git push origin HEAD:model-v3.2-autonomous-review
