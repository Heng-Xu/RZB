name: 10kV reverse-transfer data contract

on:
  workflow_dispatch:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '实验/研究/scripts/check_10kv_reverse_transfer_data.py'
      - '实验/研究/data/tuomin/10kv_case/data/tie_master.csv'
      - '实验/研究/data/tuomin/10kv_case/data/key_tie_path_parameter_impact.csv'
      - '实验/研究/data/tuomin/10kv_case/data/injection_summary.csv'
      - '实验/研究/data/tuomin/10kv_case/data/feeder_master.csv'
      - '实验/研究/data/tuomin/10kv_case/data/station_boundary_2025.csv'
      - '实验/研究/data/tuomin/10kv_case/data/node_master.csv'
      - '.github/workflows/10kv-reverse-data-contract.yml'

permissions:
  contents: write

jobs:
  check-data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install dependency
        run: python -m pip install pandas

      - name: Check reverse-transfer data contract
        run: python 实验/研究/scripts/check_10kv_reverse_transfer_data.py

      - name: Verify planning-research boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('实验/研究/results/10kv_reverse_transfer_case/data_contract_check.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['passed'] is True
          assert data['blocking_gaps'] == []
          assert data['tie002_topology_ready'] is True
          assert data['existing_tie_planning_transfer_ready'] is True
          assert data['switch_state_required_for_research_model'] is False
          assert data['selective_supply_unit_framework_ready'] is True
          assert data['selective_supply_unit_numeric_ready'] is False
          assert data['exact_new_tie_route_ready'] is False
          assert data['data_semantics']['dnan_pv_7_34_mw'] == 'REAL_OUTPUT_PEAK_ANCHOR_NOT_COMPLETE_INSTALLED_CAPACITY'
          assert data['data_semantics']['switch_states'] == 'IMPLEMENTATION_DETAIL_NOT_BLOCKING_RESEARCH_PLANNING_MODEL'
          print('10kV reverse-transfer research data contract passed: no blocking gap for planning-level study')
          PY

      - name: Commit data-contract result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '实验/研究/results/10kv_reverse_transfer_case/data_contract_check.json'
          if git diff --cached --quiet; then
            echo 'No data-contract result changes.'
          else
            git commit -m '更新10kV反向功率转移研究数据契约 [10kv-data-contract]'
            git push origin HEAD:model-v3.2-autonomous-review
          fi
