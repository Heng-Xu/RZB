name: v3.2 actual-asset parameter sensitivity

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag, or 40-character commit SHA to validate'
        required: false
        type: string
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/v32-dependency-policy.yaml'
      - '.github/workflows/v32-actual-sensitivity.yml'
      - '实验/研究/model_contract.yaml'
      - '实验/研究/model_contract_v3_2_overlay.yaml'
      - '实验/研究/data/processed/real_2021_2025/**'
      - '实验/研究/src/v32_*.py'
      - '实验/研究/src/v3_*.py'
      - '实验/研究/src/real_*.py'
      - '实验/研究/src/annual_asset_scope.py'
      - '实验/研究/src/empirical_scenarios.py'
      - '实验/研究/src/io_loader.py'
      - '实验/研究/src/milp_planner.py'
      - '实验/研究/src/legacy_milp_planner.py'
      - '实验/研究/src/net_model.py'
      - '实验/研究/src/links_sigma.py'
      - '实验/研究/src/timeseries_mapping.py'
      - '实验/研究/src/typical_days.py'
      - '实验/研究/scripts/run_v32_sensitivity_suite.py'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  parameter-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - scenario: pf090_beta080
            cos_phi: '0.90'
            beta: '0.80'
          - scenario: pf095_beta060
            cos_phi: '0.95'
            beta: '0.60'
          - scenario: pf095_beta080
            cos_phi: '0.95'
            beta: '0.80'
          - scenario: pf095_beta100
            cos_phi: '0.95'
            beta: '1.00'
          - scenario: pf100_beta080
            cos_phi: '1.00'
            beta: '0.80'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - name: Record validated commit
        run: echo "V32_VALIDATION_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pyyaml xarray linopy highspy networkx scikit-learn
      - name: Run parameter frontier
        working-directory: 实验/研究
        env:
          SCENARIO: ${{ matrix.scenario }}
          COS_PHI: ${{ matrix.cos_phi }}
          REVERSE_BETA: ${{ matrix.beta }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.v32_sensitivity import run_v32_parameter_frontier

          root=Path('.').resolve()
          scenario=os.environ['SCENARIO']
          points=[round(1.5+0.1*i,1) for i in range(16)]
          f=run_v32_parameter_frontier(
              root,
              root/'data/processed/real_2021_2025',
              root/'results/runs/v32-actual-sensitivity'/scenario,
              cos_phi=float(os.environ['COS_PHI']),
              reverse_beta=float(os.environ['REVERSE_BETA']),
              rcap_points=points,
              include_unbounded=True,
          )
          cols=['rcap','region_id','feasible','cumulative_in_service_eac_wanyuan','physical_clr_2025','storage_modules','capacity_action_delta_mva']
          print(f[f['region_id'].isin(['QX-00001','QX-00005'])][cols].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v32-sensitivity-${{ matrix.scenario }}
          path: 实验/研究/results/runs/v32-actual-sensitivity/${{ matrix.scenario }}/
          if-no-files-found: error

  aggregate-sensitivity:
    needs: parameter-scenario
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - name: Record validated commit
        run: echo "V32_VALIDATION_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: v32-sensitivity-*
          path: 实验/研究/results/runs/v32-actual-sensitivity-artifacts
      - name: Classify thresholds under each sensitivity
        working-directory: 实验/研究
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import pandas as pd
          from src.v32_threshold import classify_economic_release_thresholds

          root=Path('.').resolve()
          source=root/'results/runs/v32-actual-sensitivity-artifacts'
          files=sorted(source.glob('**/parameter_frontier.csv'))
          if len(files)!=5:
              raise RuntimeError(f'expected 5 parameter frontiers, got {len(files)}')
          fronts=[]
          classes=[]
          for p in files:
              f=pd.read_csv(p)
              scenario=str(f['scenario_id'].iloc[0])
              fronts.append(f)
              for band in (0.02,0.05,0.10):
                  c=classify_economic_release_thresholds(f, near_optimal_band=band)
                  c['scenario_id']=scenario
                  c['cos_phi']=float(f['cos_phi'].iloc[0])
                  c['reverse_beta']=float(f['reverse_beta'].iloc[0])
                  classes.append(c)
          all_front=pd.concat(fronts, ignore_index=True)
          all_class=pd.concat(classes, ignore_index=True)
          out=root/'results/runs/real-2021-2025-v32-actual-sensitivity'
          out.mkdir(parents=True, exist_ok=True)
          all_front.to_csv(out/'parameter_frontiers_coarse.csv', index=False)
          all_class.to_csv(out/'threshold_sensitivity_coarse.csv', index=False)
          (out/'manifest.json').write_text(json.dumps({
              'validation_commit_sha': os.environ['V32_VALIDATION_COMMIT_SHA'],
              'scenario_frontiers': len(files),
              'frontier_rows': int(len(all_front)),
              'classification_rows': int(len(all_class)),
              'retirement_candidates_enabled': False,
          }, ensure_ascii=False, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(all_class[(all_class['near_optimal_band'].eq(0.05))][[
              'scenario_id','region_id','threshold_status','coarse_release_threshold_lower',
              'coarse_release_threshold_upper','unbounded_cost_wanyuan'
          ]].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v32-actual-sensitivity-coarse-results
          path: 实验/研究/results/runs/real-2021-2025-v32-actual-sensitivity/
          if-no-files-found: error
