name: patch docx figure pagination once

on:
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/workflows/patch-docx-figure-pagination-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Keep each figure with its caption
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_report_docx.py')
          text = p.read_text(encoding='utf-8')
          old = '''    paragraph.alignment = WD_ALIGN_PARAGRAPH.CENTER\n    _set_no_indent(paragraph)\n    run = paragraph.add_run()'''
          new = '''    paragraph.alignment = WD_ALIGN_PARAGRAPH.CENTER\n    _set_no_indent(paragraph)\n    # 图件与图题作为一个版面单元，避免分页时出现只有图片、图题落到下一页的视觉空白误判。\n    paragraph.paragraph_format.keep_with_next = True\n    paragraph.paragraph_format.keep_together = True\n    run = paragraph.add_run()'''
          if new in text:
              print('figure pagination patch already present')
          elif old in text:
              text = text.replace(old, new, 1)
          else:
              raise SystemExit('target _add_image block not found')
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit builder fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'tools/build_report_docx.py'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '修正终稿图件与图题跨页布局'
          git fetch origin model-v3.2-autonomous-review
          git rebase --autostash origin/model-v3.2-autonomous-review
          git push origin HEAD:model-v3.2-autonomous-review
