name: v3.2 formal baseline run

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag, or 40-character commit SHA to validate'
        required: false
        type: string
  push:
    branches: [model-v3.2-autonomous-review]
    paths:
      - '.github/v32-dependency-policy.yaml'
      - '.github/workflows/v32-formal-baseline.yml'
      - '实验/研究/model_contract.yaml'
      - '实验/研究/model_contract_v3_2_overlay.yaml'
      - '实验/研究/data/processed/real_2021_2025/**'
      - '实验/研究/src/v32_*.py'
      - '实验/研究/src/v3_*.py'
      - '实验/研究/src/real_*.py'
      - '实验/研究/src/annual_asset_scope.py'
      - '实验/研究/src/empirical_scenarios.py'
      - '实验/研究/src/io_loader.py'
      - '实验/研究/src/milp_planner.py'
      - '实验/研究/src/legacy_milp_planner.py'
      - '实验/研究/src/net_model.py'
      - '实验/研究/src/links_sigma.py'
      - '实验/研究/src/timeseries_mapping.py'
      - '实验/研究/src/typical_days.py'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  real-v32-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.sha }}
      - name: Record validated commit
        run: echo "V32_VALIDATION_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pyyaml xarray linopy highspy networkx scikit-learn
      - name: Run v3.2 baseline on audited real data
        working-directory: 实验/研究
        run: |
          rm -rf results/runs/real-2021-2025-contract-v32-candidate
          python - <<'PY'
          from pathlib import Path
          import json
          from src.v32_pipeline import run_v32_pipeline

          root = Path('.').resolve()
          run_dir = root / 'results/runs/real-2021-2025-contract-v32-candidate'
          manifest = run_v32_pipeline(
              root,
              root / 'data/processed/real_2021_2025',
              run_dir,
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          echo '--- policy cost comparison ---'
          cat results/runs/real-2021-2025-contract-v32-candidate/policy_cost_comparison.csv
          echo '--- 2025 policy summary ---'
          cat results/runs/real-2021-2025-contract-v32-candidate/policy_2025_summary.csv
          echo '--- chronology nonzero rows ---'
          python - <<'PY'
          import pandas as pd
          p='results/runs/real-2021-2025-contract-v32-candidate/qx00005_chronology_comparison.csv'
          d=pd.read_csv(p)
          print(d[(d['daily_cyclic_modules'].fillna(0)!=0)|(d['continuous_8760_modules'].fillna(0)!=0)].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v32-formal-baseline-results
          path: 实验/研究/results/runs/real-2021-2025-contract-v32-candidate/
          if-no-files-found: error
